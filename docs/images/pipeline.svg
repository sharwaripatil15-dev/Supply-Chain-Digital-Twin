<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" role="img" aria-label="How AEGIS works: Disrupt, Simulate, Monte Carlo, Chaos Finder, Recover, Expand">
<defs><filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="track" x1="0" x2="1"><stop offset="0" stop-color="#ef4444"/><stop offset=".2" stop-color="#60a5fa"/><stop offset=".4" stop-color="#fbbf24"/><stop offset=".6" stop-color="#f472b6"/><stop offset=".8" stop-color="#34d399"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
<style>
.t{font:700 17px 'Segoe UI',Inter,Arial,sans-serif;fill:#eef2ff}
.d{font:500 12px 'Segoe UI',Inter,Arial,sans-serif;fill:#8f9bd0}
.e{font:28px 'Segoe UI Emoji','Apple Color Emoji',sans-serif}
.halo{opacity:0;animation:on 9.0s ease-in-out infinite}
@keyframes on{0%,100%{opacity:0}4%,14%{opacity:.85}22%{opacity:0}}
.flow{stroke-dasharray:10 14;animation:fl 1.2s linear infinite}
@keyframes fl{to{stroke-dashoffset:-24}}
</style>
<rect width="1280" height="230" rx="20" fill="#080c1f"/>
<line x1="60" y1="78" x2="1220" y2="78" stroke="#1f2850" stroke-width="6" stroke-linecap="round"/>
<line class="flow" x1="60" y1="78" x2="1220" y2="78" stroke="url(#track)" stroke-width="3" stroke-linecap="round"/>
<circle r="7" fill="#fff" filter="url(#gl)"><animate attributeName="cx" values="60;1220" dur="9.0s" repeatCount="indefinite"/><animate attributeName="cy" values="78;78" dur="9.0s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#fff" cy="78"><animate attributeName="cx" values="60;1220" dur="9.0s" repeatCount="indefinite"/></circle>
<circle class="halo" style="animation-delay:-0.30s" cx="60.0" cy="78" r="40" fill="#ef4444" filter="url(#gl)"/>
<circle cx="60.0" cy="78" r="34" fill="#0e1433" stroke="#ef4444" stroke-width="2.5"/>
<text class="e" x="60.0" y="89" text-anchor="middle">💥</text>
<text class="t" x="60.0" y="146" text-anchor="middle">Disrupt</text>
<text class="d" x="60.0" y="168" text-anchor="middle">plant fire, flood,</text>
<text class="d" x="60.0" y="184" text-anchor="middle">festival spike</text>
<text x="60.0" y="30" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="700" fill="#ef4444" letter-spacing="2">STEP 1</text>
<circle class="halo" style="animation-delay:1.50s" cx="292.0" cy="78" r="40" fill="#60a5fa" filter="url(#gl)"/>
<circle cx="292.0" cy="78" r="34" fill="#0e1433" stroke="#60a5fa" stroke-width="2.5"/>
<text class="e" x="292.0" y="89" text-anchor="middle">📅</text>
<text class="t" x="292.0" y="146" text-anchor="middle">Simulate</text>
<text class="d" x="292.0" y="168" text-anchor="middle">day-by-day flow,</text>
<text class="d" x="292.0" y="184" text-anchor="middle">Survival Clock</text>
<text x="292.0" y="30" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="2">STEP 2</text>
<circle class="halo" style="animation-delay:3.30s" cx="524.0" cy="78" r="40" fill="#fbbf24" filter="url(#gl)"/>
<circle cx="524.0" cy="78" r="34" fill="#0e1433" stroke="#fbbf24" stroke-width="2.5"/>
<text class="e" x="524.0" y="89" text-anchor="middle">🎲</text>
<text class="t" x="524.0" y="146" text-anchor="middle">Monte Carlo</text>
<text class="d" x="524.0" y="168" text-anchor="middle">P50 / P90 loss,</text>
<text class="d" x="524.0" y="184" text-anchor="middle">shortage odds</text>
<text x="524.0" y="30" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="2">STEP 3</text>
<circle class="halo" style="animation-delay:5.10s" cx="756.0" cy="78" r="40" fill="#f472b6" filter="url(#gl)"/>
<circle cx="756.0" cy="78" r="34" fill="#0e1433" stroke="#f472b6" stroke-width="2.5"/>
<text class="e" x="756.0" y="89" text-anchor="middle">🔍</text>
<text class="t" x="756.0" y="146" text-anchor="middle">Chaos Finder</text>
<text class="d" x="756.0" y="168" text-anchor="middle">every single &amp;</text>
<text class="d" x="756.0" y="184" text-anchor="middle">every pair</text>
<text x="756.0" y="30" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="700" fill="#f472b6" letter-spacing="2">STEP 4</text>
<circle class="halo" style="animation-delay:6.90s" cx="988.0" cy="78" r="40" fill="#34d399" filter="url(#gl)"/>
<circle cx="988.0" cy="78" r="34" fill="#0e1433" stroke="#34d399" stroke-width="2.5"/>
<text class="e" x="988.0" y="89" text-anchor="middle">🛟</text>
<text class="t" x="988.0" y="146" text-anchor="middle">Recover</text>
<text class="d" x="988.0" y="168" text-anchor="middle">cheapest SAFE</text>
<text class="d" x="988.0" y="184" text-anchor="middle">plan wins</text>
<text x="988.0" y="30" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="700" fill="#34d399" letter-spacing="2">STEP 5</text>
<circle class="halo" style="animation-delay:8.70s" cx="1220.0" cy="78" r="40" fill="#2dd4bf" filter="url(#gl)"/>
<circle cx="1220.0" cy="78" r="34" fill="#0e1433" stroke="#2dd4bf" stroke-width="2.5"/>
<text class="e" x="1220.0" y="89" text-anchor="middle">🗺️</text>
<text class="t" x="1220.0" y="146" text-anchor="middle">Expand</text>
<text class="d" x="1220.0" y="168" text-anchor="middle">Dijkstra + MILP</text>
<text class="d" x="1220.0" y="184" text-anchor="middle">new sites</text>
<text x="1220.0" y="30" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="700" fill="#2dd4bf" letter-spacing="2">STEP 6</text>
</svg>