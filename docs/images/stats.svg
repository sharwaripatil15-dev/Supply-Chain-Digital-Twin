<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="318 tests, 24,000 simulated scenarios, 8 detectors, 60 candidate cities, 100 Monte Carlo replays, under 1 second ML pre-screen">
<style>
.card{animation:up .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.shine{animation:sh 4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-80px)}60%,100%{transform:translateX(260px)}}
.num{font:800 34px 'Segoe UI',Inter,Arial,sans-serif}
.cap{font:600 13px 'Segoe UI',Inter,Arial,sans-serif;fill:#9aa5d6}
</style>
<defs><clipPath id="cc"><rect width="198" height="120" rx="14"/></clipPath>
<linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g transform="translate(8,15)"><g class="card" style="animation-delay:0.00s"><g clip-path="url(#cc)"><rect width="198" height="120" rx="14" fill="#0c1230"/><rect width="198" height="4" fill="#34d399"/><rect class="shine" style="animation-delay:0.0s" x="0" y="0" width="70" height="120" fill="url(#sg)"/></g><rect width="198" height="120" rx="14" fill="none" stroke="#34d399" stroke-opacity=".35"/><text class="num" x="99" y="66" text-anchor="middle" fill="#34d399">318</text><text class="cap" x="99" y="94" text-anchor="middle">tests passing</text></g></g>
<g transform="translate(220,15)"><g class="card" style="animation-delay:0.12s"><g clip-path="url(#cc)"><rect width="198" height="120" rx="14" fill="#0c1230"/><rect width="198" height="4" fill="#a78bfa"/><rect class="shine" style="animation-delay:0.5s" x="0" y="0" width="70" height="120" fill="url(#sg)"/></g><rect width="198" height="120" rx="14" fill="none" stroke="#a78bfa" stroke-opacity=".35"/><text class="num" x="99" y="66" text-anchor="middle" fill="#a78bfa">24,000</text><text class="cap" x="99" y="94" text-anchor="middle">simulated scenarios</text></g></g>
<g transform="translate(432,15)"><g class="card" style="animation-delay:0.24s"><g clip-path="url(#cc)"><rect width="198" height="120" rx="14" fill="#0c1230"/><rect width="198" height="4" fill="#60a5fa"/><rect class="shine" style="animation-delay:1.0s" x="0" y="0" width="70" height="120" fill="url(#sg)"/></g><rect width="198" height="120" rx="14" fill="none" stroke="#60a5fa" stroke-opacity=".35"/><text class="num" x="99" y="66" text-anchor="middle" fill="#60a5fa">8</text><text class="cap" x="99" y="94" text-anchor="middle">insight detectors</text></g></g>
<g transform="translate(644,15)"><g class="card" style="animation-delay:0.36s"><g clip-path="url(#cc)"><rect width="198" height="120" rx="14" fill="#0c1230"/><rect width="198" height="4" fill="#2dd4bf"/><rect class="shine" style="animation-delay:1.5s" x="0" y="0" width="70" height="120" fill="url(#sg)"/></g><rect width="198" height="120" rx="14" fill="none" stroke="#2dd4bf" stroke-opacity=".35"/><text class="num" x="99" y="66" text-anchor="middle" fill="#2dd4bf">60</text><text class="cap" x="99" y="94" text-anchor="middle">candidate cities</text></g></g>
<g transform="translate(856,15)"><g class="card" style="animation-delay:0.48s"><g clip-path="url(#cc)"><rect width="198" height="120" rx="14" fill="#0c1230"/><rect width="198" height="4" fill="#fbbf24"/><rect class="shine" style="animation-delay:2.0s" x="0" y="0" width="70" height="120" fill="url(#sg)"/></g><rect width="198" height="120" rx="14" fill="none" stroke="#fbbf24" stroke-opacity=".35"/><text class="num" x="99" y="66" text-anchor="middle" fill="#fbbf24">100×</text><text class="cap" x="99" y="94" text-anchor="middle">Monte Carlo replays</text></g></g>
<g transform="translate(1068,15)"><g class="card" style="animation-delay:0.60s"><g clip-path="url(#cc)"><rect width="198" height="120" rx="14" fill="#0c1230"/><rect width="198" height="4" fill="#f472b6"/><rect class="shine" style="animation-delay:2.5s" x="0" y="0" width="70" height="120" fill="url(#sg)"/></g><rect width="198" height="120" rx="14" fill="none" stroke="#f472b6" stroke-opacity=".35"/><text class="num" x="99" y="66" text-anchor="middle" fill="#f472b6">&lt; 1 s</text><text class="cap" x="99" y="94" text-anchor="middle">ML pre-screen of 2,000</text></g></g>
</svg>